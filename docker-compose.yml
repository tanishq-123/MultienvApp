services:
  backend-dev:
    build: ./backend/dev
    container_name: backend-dev
    env_file: ./backend/dev/.env
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/dev:/app
    networks: [appnet]

  backend-prod:
    build: ./backend/prod
    container_name: backend-prod
    env_file: ./backend/prod/.env
    ports:
      - "3002:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [appnet]

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-dev
      - backend-prod
    networks: [appnet]

networks:
  appnet: